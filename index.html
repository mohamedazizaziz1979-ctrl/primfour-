 if(RAW.every((_,i)=>S.cl.includes(i)))bd('we');
 S.best=Math.max(S.best,R.xp);save();V='r';draw()}

const topbar=()=>`<div class=row style="margin:4px 0"><div class=logo onclick="hm()"><svg width=44 height=50 viewBox="0 0 44 50"><defs><linearGradient id=g1 x1=0 y1=0 x2=0 y2=1><stop offset=0 stop-color="#fde047"/><stop offset=1 stop-color="#f97316"/></linearGradient></defs><path d="M22 2 40 9v14c0 12-8 20-18 25C12 43 4 35 4 23V9z" fill="url(#g1)" stroke="#fff" stroke-width=3 stroke-linejoin=round /><path d="M22 14L24.47 20.6 31.51 20.91 26 25.3 27.88 32.09 22 28.2 16.12 32.09 18 25.3 12.49 20.91 19.53 20.6Z" fill="#fff"/></svg><span class=lt>الأبطال<small>CHAMPIONS</small></span></div><button class="btn alt sm" aria-label=sound onclick="S.mute=!S.mute;save();draw()"><svg width=22 height=22 viewBox="0 0 24 24" fill="none" stroke="#3730a3" stroke-width=2.5 stroke-linecap=round stroke-linejoin=round><path d="M4 9v6h4l5 4V5L8 9z" fill="#3730a3"/>${S.mute?'<path d="M17 9l5 6M22 9l-5 6"/>':'<path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>'}</svg></button></div>`;
const hm=()=>{clearInterval(R.iv);R={};V='h';draw()};
const to=v=>{V=v;draw()};
function draw(){$('app').innerHTML=topbar()+({n:namev,h:home,w:wmenu,p:play,r:res,g:gal,s:shop,b:bank}[V])();window.scrollTo(0,0)}

function home(){const wk=weak(),ms=WORDS.filter(w=>{const m=S.ms[w.id];return m&&m.c>=2&&m.c>m.w}).length;
 return `<div class=card><div class=row><div class=hero>${S.hero}</div><div style="flex:1"><b>Level ${lv()}</b> · ${S.xp} XP<div class=bar><i style="width:${S.xp%500/5}%"></i></div><small>${500-S.xp%500} XP to level ${lv()+1}</small></div></div>
 <p style="text-align:center;margin-top:6px"><b>👋 ${S.name}</b> <button class="btn alt sm" onclick="to('n')">✏️</button><br>Primary 4 — Unit 2 Challenge · v9<br><small>Learn Words. Earn Rewards. Become a Champion!</small></p></div>
 <div class=stats><div>🪙 ${S.coins}<br><small>Coins</small></div><div>🏆 ${S.best}<br><small>Best score</small></div><div>📚 ${ms}/${WORDS.length}<br><small>Words mastered</small></div><div>🏅 ${S.bd.length}/5<br><small>Badges</small></div></div>
 ${S.pend?`<div class=card style="background:#f59e0b;color:#3b2a00"><b class=ar>ابعت نتيجتك للمعلم على واتساب عشان يتفتح العالم التالي 📲</b><a class="btn w100" style="text-decoration:none;text-align:center;background:#25d366;color:#fff" href="${wa(S.pend)}" target="_blank" rel="noopener" onclick="setTimeout(sent,600)">📲 إرسال النتيجة للمعلم</a></div>`:''}
 <h3 style="margin:12px 0 4px">Adventure Map</h3>
 ${RAW.map((r,i)=>`<button class="btn c${i} w100 ${unl(i)?'':'lock'}" ${unl(i)?'':'disabled'} onclick="cw=${i};to('w')"><span class=row><span><span class=ic>${wi(i,44)}</span>World ${i+1}: ${r[0]}</span><span>${S.cl.includes(i)?gi('star','gold',28):unl(i)?gi('play','green',28):gi('lock','gray',28)}</span></span></button>`).join('')}
 <button class="btn c4 w100 ${bossOk()?'':'lock'}" ${bossOk()?'':'disabled'} onclick="go('G',-1)">${gi('crown','gold',32)} Final Boss Challenge ${S.tr?gi('trophy','gold',26):bossOk()?'':'(clear all worlds)'}</button>
 ${wk.length?`<div class=card><b>Words needing revision (${wk.length})</b><br>${wk.slice(0,8).map(w=>`<span class=bg>${w.e}</span>`).join('')}<button class="btn w100" onclick="go('R',-1)">${gi('redo','blue',28)} Revision Round</button></div>`:''}
 <div class=row><button class="btn alt" style="flex:1" onclick="to('b')">${gi('wbook','cyan',28)} Word Bank</button><button class="btn alt" style="flex:1" onclick="to('g')">${gi('medal','orange',28)} Badges</button><button class="btn alt" style="flex:1" onclick="to('s')">${gi('bag','purple',28)} Shop</button></div>`}

const dn=m=>(S.pl[cw]||[]).includes(m)?' '+gi('check','green',22):'';
function wmenu(){const r=RAW[cw];return `<div class=card><h2>${wi(cw,36)} World ${cw+1}</h2><p>${r[0]}</p><p>${S.cl.includes(cw)?'Cleared! ':''}Play all 6 games to unlock the next world: <b>${(S.pl[cw]||[]).length}/6</b></p></div>
 ${MODES.map((m,k)=>`<button class="btn c${k} w100" onclick="go('${m[0]}',${cw})"><span class=ic>${gi(m[1],MC[k],44)}</span>${m[2]}${dn(m[0])}</button>`).join('')}
 <div class=row><button class="btn c5 w100" style="flex:1" onclick="go('F',${cw},0)">${gi('timer','red',28)} Time Attack (60s)${dn('F')}</button><button class="btn c3 w100" style="flex:1" onclick="go('F',${cw},1)">${gi('infinity','green',28)} Untimed${dn('F')}</button></div>`}

function play(){
 if(R.m=='D')return `<div class=card><div class=row><span>Pairs ${R.mt}/${R.np}</span><span>⭐ ${R.xp}</span><span>❌ ${R.ms}</span></div><p style="text-align:center">Match each English word with its Arabic meaning</p></div><div class=grid>${R.cd.map((c,i)=>`<button class="mc ${c.f||c.d?'up':''} ${c.l?'':'ar'}" onclick="flip(${i})">${c.f||c.d?c.t:'❓'}</button>`).join('')}</div>`;
 const q=cq(),timed=R.tm!=null;
 const hd=`<div class=card><div class=row><span>${timed?'⏱ <b id=tm>'+R.tm+'</b>s':'Q '+(R.i+1)+'/'+R.qs.length}</span><span>⭐ ${R.xp}</span><span>🔥 ${R.st}</span></div><div class=bar><i style="width:${timed?100:R.i/R.qs.length*100}%"></i></div></div>`;
 let b;
 if(q.k=='s')b=`<div class=big>${pic(q.w.m)}</div><div class="pr ar">${q.w.a}</div><div class=slots>${[...q.ans].map((_,i)=>`<span class=slot>${q.u[i]!=null?q.tl[q.u[i]]:''}</span>`).join('')}</div><div class=tiles>${q.tl.map((c,i)=>`<button class=tile ${q.u.includes(i)||q.dn?'disabled':''} onclick="tl(${i})">${c}</button>`).join('')}</div>${q.h?'<p style="text-align:center">Starts with: <b>'+q.ans[0]+'</b></p>':''}${q.dn?'':'<button class="btn alt sm" onclick="clr()">Clear</button>'}`;
 else b=`${q.big?'<div class=big>'+pic(q.big)+'</div>':''}<div class="pr ${q.pa?'ar':''}">${q.p}</div><div class=opts>${q.o.map((t,i)=>q.gone&&q.gone.includes(i)?'':`<button class="opt ${q.L?'':'ar'} ${q.x.includes(i)?'bad':''} ${q.dn&&t==q.ans?'good':''}" ${q.dn||q.x.includes(i)?'disabled':''} onclick="pk(${i})">${t}</button>`).join('')}</div>`;
 return hd+`<div class=card>${b}</div>${q.fb?'<div class=fb>'+q.fb+'</div>':''}<div class=row>${q.dn?'':`<button class="btn alt" onclick="hint()" ${q.h?'disabled':''}>💡 Hint</button>`}${q.dn?`<button class="btn" style="flex:1" onclick="nx()">${R.i+1>=R.qs.length?'Finish 🏁':'Next ➜'}</button>`:''}</div>`}

function res(){const wr=R.wr.map(id=>WORDS.find(x=>x.id==id)),nb=R.nb;
 return `<div class=card style="text-align:center"><div class=big>${R.pass?(R.m=='G'?'🏆':'🎉'):'💪'}</div><h2>${R.pass?(R.m=='G'?'Champion Trophy unlocked!':'Level Complete!'):'Good effort! Try again to reach 60%'}</h2>
 ${lv()>R.l0?'<p>⬆️ Level up! You are now level '+lv()+'</p>':''}</div>${sendBox()}
 <div class=card><div class=wl><span>Correct answers</span><b>${R.ok} / ${R.n}</b></div><div class=wl><span>Accuracy</span><b>${R.acc}%</b></div>
 <div class=wl><span>XP from answers</span><b>${R.base}</b></div><div class=wl><span>Streak bonuses</span><b>${R.sb}</b></div><div class=wl><span>Level bonus</span><b>${R.lb}</b></div>
 <div class=wl><span><b>Total score</b></span><b>⭐ ${R.xp} XP</b></div><div class=wl><span>Coins earned</span><b>🪙 ${R.coins}</b></div></div>
 ${nb.length?`<div class=card><b>Achievements unlocked</b><br>${nb.map(i=>`<span class=bg>${BD[i][1]} ${BD[i][0]}</span>`).join('')}</div>`:''}
 ${wr.length?`<div class=card><b>Recommended revision words</b>${wr.map(w=>`<div class=wl><span>${w.e}</span><span class=ar>${w.a}</span></div>`).join('')}</div>`:''}
 <button class="btn w100" onclick="go('${R.m}',${R.wi},${R.u?1:0})">🔄 PLAY AGAIN</button><button class="btn alt w100" onclick="hm()">🏠 Home</button>`}

const MN={A:'Word Match',B:'Missing Word',C:'Spelling Rush',D:'Memory Cards',E:'Picture Challenge',F:'Time Attack',G:'Final Boss',R:'Revision'};
const TEACHER='201116597331';
const wa=o=>'https://wa.me/'+TEACHER+'?text='+encodeURIComponent(`Vocabulary Quest - Primary 4 Unit 2\nالاسم: ${S.name}\nالعالم: ${o.wi>=0?(o.wi+1)+' - '+RAW[o.wi][0]:'Final Boss'}\nالنشاط: ${MN[o.m]}\nالإجابات الصحيحة: ${o.ok}/${o.n}\nالنسبة: ${o.acc}%\nالنقاط: ${o.xp} XP\nالمستوى: ${lv()}`);
function sent(){S.pend=null;save();draw()}
function sendBox(){const o={wi:R.wi,m:R.m,ok:R.ok,n:R.n,acc:R.acc,xp:R.xp};
 const a=(c,t,x)=>`<a class="btn w100" style="text-decoration:none;text-align:center;${c}" href="${wa(o)}" target="_blank" rel="noopener" ${x}>${t}</a>`;
 const pl=S.pl[R.wi]||[],prog=R.wi>=0&&'ABCDEF'.includes(R.m)&&R.n>=3?`<div class=card style="text-align:center">${R.unlocked?'Next world unlocked!':pl.length>=6?'All 6 games in this world are done':'Games completed in this world: <b>'+pl.length+'/6</b>. Play all of them to unlock the next world.'}</div>`:'';
 return prog+(R.n?a('background:#fff;color:#166534','📤 Send result to teacher (optional)',''):'')}
function namev(){return `<div class=card style="text-align:center"><div class=big>🎒</div><h2 class=ar>اكتب اسمك الرباعي</h2><p class=ar>مثال: أحمد محمد علي حسن</p><input id=nm class=ar value="${S.name||''}" placeholder="الاسم الرباعي" maxlength=60><p id=er class=ar style="color:#fde047"></p><button class="btn c0 w100" onclick="svn()">ابدأ المغامرة 🚀</button></div>`}
function svn(){const v=$('nm').value.trim().replace(/\s+/g,' '),p=v.split(' ');if(p.length<4||!/^[\p{L} ]+$/u.test(v)||p.some(x=>x.length<2)){$('er').textContent='لازم تكتب الاسم الرباعي بالحروف (4 كلمات على الأقل)';return}S.name=v;save();hm()}
function gal(){return `<div class=card><h2>🏅 Achievements</h2>${Object.entries(BD).map(([k,v])=>`<div class="wl ${S.bd.includes(k)?'':'lock'}"><span>${v[1]} <b>${v[0]}</b><br><small>${v[2]}</small></span><span>${S.bd.includes(k)?'✅':'🔒'}</span></div>`).join('')}</div><div class=card style="text-align:center"><div class="big ${S.tr?'':'lock'}">🏆</div><p>${S.tr?'Champion Trophy earned!':'Beat the Final Boss to earn the Champion Trophy'}</p></div>`}
function buy(h,c){if(S.own.includes(h)){S.hero=h}else if(S.coins>=c){S.coins-=c;S.own.push(h);S.hero=h;snd(784)}save();draw()}
function shop(){return `<div class=card><h2>🛍️ Hero Shop</h2><p>Coins: 🪙 ${S.coins} (play to earn more — no real money!)</p>${HEROES.map(h=>`<div class=wl><span style="font-size:30px">${h[0]}</span><button class="btn sm" ${S.own.includes(h[0])||S.coins>=h[1]?'':'disabled'} onclick="buy('${h[0]}',${h[1]})">${S.hero==h[0]?'✔ Equipped':S.own.includes(h[0])?'Equip':'🪙 '+h[1]}</button></div>`).join('')}</div>`}
function bank(){return RAW.map((r,i)=>`<div class=card><b>${wi(i,30)} World ${i+1}: ${r[0]}</b>${WORDS.filter(w=>w.w==i).map(w=>{const m=S.ms[w.id]||{c:0,w:0};return `<div class=wl><span>${m.w>m.c?'🔴':m.c>=2?'🟢':'⚪'} ${pic(w.m)} ${w.e}</span><span class=ar>${w.a}</span></div>`}).join('')}</div>`).join('')}
draw();
$('fl').innerHTML=['⭐','🤝','🚦','🧵','📔','🌍','🌳','🧹','🪙','🏭','🚆','🚲','🍎','🌾'].map((e,i)=>`<span style="left:${(i*7+3)%95}%;animation-duration:${14+i%6*3}s;animation-delay:-${i*2}s">${e}</span>`).join('');
</script></body></html>
